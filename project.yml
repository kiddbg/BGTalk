name: BGTalk
options:
  bundleIdPrefix: com.kiddbg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  BGTalk:
    type: application
    platform: iOS
    sources:
      - path: BGTalkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiddbg.BGTalk
        INFOPLIST_FILE: BGTalkApp/Info.plist
        PRODUCT_NAME: BGTalk
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
